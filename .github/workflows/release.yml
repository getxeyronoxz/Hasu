name: Build and publish Hasu

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Node dependencies
        run: npm ci

      - name: Smoke-test .NET sidecar
        run: npm run test:dotnet-agent

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install pyinstaller

      - name: Build desktop agent
        run: pyinstaller desktop_agent.spec --distpath agent_dist --workpath agent_build

      - name: Publish .NET desktop sidecar
        run: dotnet publish desktop_agent.net/Hasu.DesktopAgent/Hasu.DesktopAgent.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o agent_dist

      - name: Build launcher assets
        shell: powershell
        run: .\scripts\build-launcher.ps1

      - name: Build app and public installer
        shell: cmd
        run: npm run dist:public -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hasu-release
          path: |
            release-public/*
            agent_dist/Hasu.DesktopAgent.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          gh release create $env:GITHUB_REF_NAME release-public/* --title $env:GITHUB_REF_NAME --notes "Automated Windows build."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
